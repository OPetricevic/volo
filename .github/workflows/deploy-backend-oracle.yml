name: Deploy Backend (OracleHost)

on:
  push:
    branches: [main]
    paths:
      - 'volo-api/**'
      - '.github/workflows/deploy-backend-oracle.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/volo-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./volo-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event.inputs.environment != 'production'
    environment: dev

    steps:
      - name: Deploy to OracleHost (dev)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.ORACLE_HOST }}
          username: ${{ vars.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            sudo /usr/local/sbin/deploy-oracle-app ${{ vars.ORACLE_APP_ID }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'
    environment: production

    steps:
      - name: Deploy to OracleHost (production)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.ORACLE_HOST }}
          username: ${{ vars.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            sudo /usr/local/sbin/deploy-oracle-app ${{ vars.ORACLE_APP_ID }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
