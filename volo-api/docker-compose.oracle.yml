# OracleHost app-slot compose file
# Deployed to: /opt/apps/<app-id>/stack/
# Env loaded from: /etc/apps/<app-id>/<app>.env (via .deploy.env)
#
# This file is used by deploy-oracle-app. Do NOT include database or
# reverse proxy services — those are managed at the platform level.

services:
  api:
    image: ${DEPLOY_IMAGE:-ghcr.io/opetricevic/volo/volo-api:latest}
    restart: unless-stopped
    env_file:
      - .deploy.env
    ports:
      - "${VOLO_PORT:-8080}:${VOLO_PORT:-8080}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${VOLO_PORT:-8080}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
