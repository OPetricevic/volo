# OracleHost app-slot compose file
# Deployed to: /opt/apps/<app-id>/stack/
# Env loaded from: /etc/apps/<app-id>/<app>.env (via .deploy.env)
#
# This file is used by deploy-oracle-app. Do NOT include database or
# reverse proxy services — those are managed at the platform level.

services:
  api:
    image: ${IMAGE_REF:?IMAGE_REF must be set}
    container_name: ${CONTAINER_NAME:?CONTAINER_NAME must be set}
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${ENV_FILE:?ENV_FILE must be set}
    environment:
      VOLO_PORT: ${PORT:?PORT must be set}
      VOLO_DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      VOLO_REDIS_ADDR: ${VOLO_REDIS_ADDR:?VOLO_REDIS_ADDR must be set}
      VOLO_REDIS_PASSWORD: ${VOLO_REDIS_PASSWORD:-}
      VOLO_JWT_SECRET: ${VOLO_JWT_SECRET:?VOLO_JWT_SECRET must be set}
      VOLO_CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      VOLO_LOG_LEVEL: ${VOLO_LOG_LEVEL:-info}
      VOLO_GOOGLE_CLIENT_ID: ${VOLO_GOOGLE_CLIENT_ID:-}
      VOLO_GOOGLE_CLIENT_SECRET: ${VOLO_GOOGLE_CLIENT_SECRET:-}
      VOLO_SENTRY_DSN: ${VOLO_SENTRY_DSN:-}
      VOLO_ENVIRONMENT: ${APP_ENV:-production}
      VOLO_MODEL_PATH: ${VOLO_MODEL_PATH:-/app/models}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:${PORT}/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
