version: "3.8"

services:
  volo-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - VOLO_PORT=8080
      - VOLO_DATABASE_URL=postgres://volo:volo@postgres:5432/volo?sslmode=disable
      - VOLO_REDIS_ADDR=redis:6379
      - VOLO_JWT_SECRET=${VOLO_JWT_SECRET:-dev-secret-change-in-production}
      - VOLO_CORS_ORIGINS=${VOLO_CORS_ORIGINS:-*}
      - VOLO_LOG_LEVEL=info
      - VOLO_GOOGLE_CLIENT_ID=${VOLO_GOOGLE_CLIENT_ID:-}
      - VOLO_GOOGLE_CLIENT_SECRET=${VOLO_GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: volo
      POSTGRES_PASSWORD: volo
      POSTGRES_DB: volo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
